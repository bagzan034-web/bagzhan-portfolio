<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Багжан — веб-разработчик</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #111827, #312e81);
    }

    .card {
      width: 85%;
      max-width: 500px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 25px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #ddddff;
    }

    .skills {
      margin: 25px 0;
    }

    .skills span {
      display: inline-block;
      margin: 5px;
      padding: 10px 15px;
      background: #7c3aed;
      border-radius: 20px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      color: white;
      background: #ec4899;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Привет, я Багжан 👋</h1>

    <p>
      Я начинающий веб-разработчик. Создаю современные сайты,
      онлайн-меню и небольшие игры.
    </p>

    <div class="skills">
      <span>Сайты</span>
      <span>Анимации</span>
      <span>Мини-игры</span>
    </div>

    <button onclick="alert('Скоро здесь появятся мои проекты!')">
      Мои работы
    </button>
  </div>
</body>
</html>
